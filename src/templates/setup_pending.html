<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IVR Admin — Check Your Email</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.card {
  background: white; border-radius: 16px; padding: 48px 40px;
  width: 100%; max-width: 420px; text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.icon { font-size: 56px; margin-bottom: 20px; }
h1 { font-size: 22px; font-weight: 700; color: #1f2937; margin-bottom: 10px; }
p { color: #6b7280; font-size: 14px; line-height: 1.6; margin-bottom: 12px; }
.email { font-weight: 600; color: #1f2937; }
.note {
  margin-top: 20px; padding: 12px 16px;
  background: #f3f4f6; border-radius: 8px;
  font-size: 12px; color: #6b7280; line-height: 1.5;
}
a { color: #4f46e5; font-size: 13px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">📬</div>
  <h1>Check your inbox</h1>
  <p>A verification link was sent to <span class="email">{{ email }}</span>.<br>
  Click it to verify your email and log in automatically.</p>
  <div class="note">
    Didn't receive it? Check your spam folder.<br>
    If the email never arrives, <a href="/admin/setup">go back and try a different Resend API key</a>.
  </div>
</div>
</body>
</html>
