<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IVR Admin — Login</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 20px;
}
.card {
  background: white;
  border-radius: 16px;
  padding: 40px;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.logo {
  width: 48px; height: 48px;
  background: #4f46e5;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
  margin-bottom: 20px;
}
h1 { font-size: 22px; font-weight: 700; color: #1f2937; margin-bottom: 4px; }
p { color: #6b7280; font-size: 14px; margin-bottom: 28px; }
label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
input[type=email], input[type=password] {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid #e5e7eb;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  margin-bottom: 14px;
  transition: border-color 0.15s;
}
input[type=email]:focus, input[type=password]:focus { border-color: #4f46e5; }
button[type=submit] {
  width: 100%;
  margin-top: 4px;
  padding: 12px;
  background: #4f46e5;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}
button[type=submit]:hover { background: #4338ca; }
.error { color: #ef4444; font-size: 13px; margin-top: 12px; text-align: center; }
.bottom-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  max-width: 360px;
  gap: 12px;
}
.active-pill {
  display: flex;
  align-items: center;
  gap: 7px;
  background: rgba(255,255,255,0.18);
  border: 1px solid rgba(255,255,255,0.3);
  padding: 7px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  color: white;
  flex: 1;
  min-width: 0;
}
.active-dot {
  width: 7px; height: 7px;
  background: #4ade80;
  border-radius: 50%;
  flex-shrink: 0;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.active-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn-test {
  background: rgba(255,255,255,0.18);
  border: 1px solid rgba(255,255,255,0.3);
  color: white;
  padding: 7px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s;
  flex-shrink: 0;
}
.btn-test:hover { background: rgba(255,255,255,0.28); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🎙</div>
  <h1>IVR Admin Panel</h1>
  <p>Sign in to manage your AI receptionist</p>
  <form method="POST" action="/admin/login">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" autofocus autocomplete="email">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
    <button type="submit">Sign In</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </form>
</div>
{% if active_uc_name %}
<div class="bottom-bar">
  <div class="active-pill">
    <span class="active-dot"></span>
    <span class="active-name">{{ active_uc_name }}</span>
  </div>
  <button class="btn-test" onclick="window.open('/admin/test-call','test_call','width=340,height=640,resizable=no,scrollbars=no')">📞 Test Call</button>
</div>
{% endif %}
</body>
</html>
