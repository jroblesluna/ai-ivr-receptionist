name: Deploy Backend (PROD)

on:
  workflow_dispatch:
    inputs:
      confirm_environment:
        description: "Type 'prod' to confirm production deployment"
        required: true
        type: string

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: ${{ secrets.PROD_ECR_REPOSITORY }}
  ENVIRONMENT: prod

jobs:
  validate:
    name: Validate deployment target
    runs-on: ubuntu-latest
    steps:
      - name: Reject environment mismatch
        if: ${{ github.event.inputs.confirm_environment != 'prod' }}
        run: |
          echo "::error::Environment mismatch: expected 'prod' but got '${{ github.event.inputs.confirm_environment }}'"
          echo "::error::Deployment rejected. You must type 'prod' to confirm production deployment."
          exit 1

  build-and-deploy:
    name: Build and Deploy to PROD
    runs-on: ubuntu-latest
    needs: validate
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        id: build
        run: |
          IMAGE_TAG="${{ github.sha }}"
          ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          
          docker build -t "${IMAGE_URI}" .
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Push Docker image to ECR
        run: |
          docker push "${{ steps.build.outputs.image_uri }}"

      - name: Deploy via SSM send-command
        id: ssm-deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.PROD_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"cd /opt/pickup && export ECR_REPOSITORY_URL=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }} && export IMAGE_TAG=${{ steps.build.outputs.image_tag }} && ./scripts/deploy.sh ${{ steps.build.outputs.image_uri }}\"]" \
            --timeout-seconds 300 \
            --output text \
            --query "Command.CommandId")
          
          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          echo "Waiting for SSM command ${COMMAND_ID} to complete..."
          
          # Wait for the command to complete (poll every 10s, timeout 300s)
          SECONDS_WAITED=0
          while [ $SECONDS_WAITED -lt 300 ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${{ secrets.PROD_EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment completed successfully."
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "::error::SSM command failed with status: ${STATUS}"
              # Fetch command output for debugging
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${{ secrets.PROD_EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text || true
              exit 1
            fi
            
            sleep 10
            SECONDS_WAITED=$((SECONDS_WAITED + 10))
          done
          
          echo "::error::SSM command timed out after 300 seconds"
          exit 1

      - name: Report deployment failure
        if: failure()
        run: |
          echo "::error::PROD deployment failed. Check the logs above for details."
          echo "Image: ${{ steps.build.outputs.image_uri }}"
          echo "Environment: ${ENVIRONMENT}"
