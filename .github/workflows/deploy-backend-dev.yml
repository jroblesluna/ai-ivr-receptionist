name: Deploy Backend (DEV)

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "terraform/**"

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: pickup-dev
  ENVIRONMENT: dev

jobs:
  build-and-deploy:
    name: Build and Deploy to DEV
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        id: build
        run: |
          IMAGE_TAG="${{ github.sha }}"
          ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          
          docker build -t "${IMAGE_URI}" .
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Push Docker image to ECR
        run: |
          docker push "${{ steps.build.outputs.image_uri }}"

      - name: Deploy via SSM send-command
        id: ssm-deploy
        run: |
          INSTANCE_ID="i-0cbbe2bb4ce9cd374"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"cd /opt/pickup && ./deploy.sh ${{ steps.build.outputs.image_uri }}\"]" \
            --timeout-seconds 300 \
            --output text \
            --query "Command.CommandId")
          
          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          echo "Waiting for SSM command ${COMMAND_ID} to complete..."
          
          # Wait for the command to complete (poll every 10s, timeout 300s)
          SECONDS_WAITED=0
          while [ $SECONDS_WAITED -lt 300 ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            
            if [ "$STATUS" = "Success" ]; then
              echo "Deployment completed successfully."
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "::error::SSM command failed with status: ${STATUS}"
              # Fetch command output for debugging
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --query "StandardErrorContent" \
                --output text || true
              exit 1
            fi
            
            sleep 10
            SECONDS_WAITED=$((SECONDS_WAITED + 10))
          done
          
          echo "::error::SSM command timed out after 300 seconds"
          exit 1

      - name: Report deployment failure
        if: failure()
        run: |
          echo "::error::DEV deployment failed. Check the logs above for details."
          echo "Image: ${{ steps.build.outputs.image_uri }}"
          echo "Environment: ${ENVIRONMENT}"
